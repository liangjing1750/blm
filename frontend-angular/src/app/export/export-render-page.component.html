<main class="export-render-page">
  @if (loading()) {
    <div class="export-render-state">正在准备导出图形...</div>
  } @else if (error()) {
    <div class="export-render-state export-render-error">{{ error() }}</div>
  } @else if (activeGraph(); as graph) {
    <section class="export-render-canvas" [attr.data-export-active-graph]="graph.id">
      <app-preview-graph-host
        [kind]="graph.kind"
        [targetId]="targetIdForGraph()"
        [exportGraphId]="graph.id"
      ></app-preview-graph-host>
    </section>
  } @else {
    <div class="export-render-state">当前文档没有可导出的图形。</div>
  }
</main>
