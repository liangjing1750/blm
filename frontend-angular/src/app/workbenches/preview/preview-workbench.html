<section class="preview-workbench preview-wrap" data-testid="preview-workbench">
  <div class="preview-topbar">
    <button class="btn btn-outline btn-sm" type="button" data-testid="preview-export-bundle" [disabled]="!runtime.currentFile" (click)="exportBundle()">→ 导出</button>
    <button class="btn btn-outline btn-sm" type="button" data-testid="preview-export-markdown" (click)="exportMarkdown()">导出 Markdown</button>
    <button class="btn btn-primary btn-sm" type="button" data-testid="preview-export-json" (click)="exportJson()">导出 JSON</button>
    <button class="btn btn-primary btn-sm" type="button" data-testid="preview-export-docx" [disabled]="!runtime.currentFile || !!exportWait()" (click)="exportDocx()">导出 DOCX</button>
    <button id="preview-raw-toggle" class="btn btn-ghost-sm" type="button" style="margin-left:auto" (click)="toggleRaw()">
      {{ showRaw() ? '显示渲染预览' : '显示原文 MD' }}
    </button>
  </div>

  @if (!showRaw()) {
    <div id="preview-body" class="preview-body">
      <aside id="preview-outline" class="preview-outline" data-testid="preview-outline">
        <div class="preview-outline-title">大纲视图</div>
        <div class="preview-outline-list">
          @for (item of outlineItems(); track item.id) {
            <button class="preview-outline-link depth-{{ item.depth }}" type="button" (click)="jumpTo(item.id)">
              {{ item.label }}
            </button>
          }
        </div>
      </aside>
      <div id="preview-rendered" class="preview-rendered pv-content" data-testid="preview-rendered" [innerHTML]="renderedHtml()"></div>
    </div>
  } @else {
    <pre id="preview-raw" class="preview-md" data-testid="preview-raw">{{ markdown() }}</pre>
  }

  <app-wait-dialog
    *ngIf="exportWait() as wait"
    [title]="wait.title"
    [description]="wait.description"
  ></app-wait-dialog>
</section>
