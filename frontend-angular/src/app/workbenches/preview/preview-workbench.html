<section class="preview-workbench preview-wrap" data-testid="preview-workbench">
  <div class="preview-topbar">
    <button class="btn btn-outline btn-sm" type="button" data-testid="preview-export-json" [disabled]="!runtime.currentFile" (click)="exportJson()">导出 JSON</button>
    <button class="btn btn-outline btn-sm" type="button" data-testid="preview-export-markdown" [disabled]="!runtime.currentFile" (click)="exportMarkdown()">导出 MD</button>
    <button class="btn btn-outline btn-sm" type="button" data-testid="preview-export-docx" [disabled]="!runtime.currentFile || !!exportWait()" (click)="exportDocx()">导出 DOCX</button>
    <button id="preview-raw-toggle" class="btn btn-ghost-sm" type="button" style="margin-left:auto" (click)="toggleRaw()">
      {{ showRaw() ? '显示渲染预览' : '显示原文 MD' }}
    </button>
  </div>

  @if (!showRaw()) {
    <div id="preview-body" class="preview-body">
      <aside id="preview-outline" class="preview-outline" data-testid="preview-outline">
        <div class="preview-outline-head">
          <span class="preview-outline-title">大纲视图</span>
          @if (collapsedOutlineIds().size) {
            <button class="preview-outline-expand-all" type="button" (click)="expandAll()">展开全部</button>
          }
        </div>
        <div class="preview-outline-list">
          @for (item of outlineItems(); track item.id; let idx = $index) {
            @if (!isOutlineHidden(item, idx)) {
              <button
                class="preview-outline-link depth-{{ item.depth }}"
                [class.is-collapsible]="item.depth <= 1"
                [class.is-collapsed]="isOutlineCollapsed(item)"
                type="button"
                [attr.data-oid]="item.id"
                (click)="handleOutlineClick(item)"
              >
                <span class="outline-number">{{ item.number }}</span>
                <span class="outline-label">{{ item.label }}</span>
                @if (item.depth <= 1) {
                  <span class="outline-toggle">▾</span>
                }
              </button>
            }
          }
        </div>
      </aside>

      <div id="preview-rendered" class="preview-rendered pv-content" data-testid="preview-rendered">
        <div [innerHTML]="previewHtml()"></div>
      </div>
    </div>
  } @else {
    <pre id="preview-raw" class="preview-md" data-testid="preview-raw">{{ markdown() }}</pre>
  }

  <app-wait-dialog
    *ngIf="exportWait() as wait"
    [title]="wait.title"
    [description]="wait.description"
  ></app-wait-dialog>
</section>
