<div class="component-shell" data-testid="component-workbench-angular-shell">
  <div class="component-shell-tabs" data-testid="component-workbench-tabs">
    <button
      *ngFor="let tab of tabs"
      type="button"
      class="component-shell-tab"
      [class.active]="activeTab() === tab.id"
      [attr.data-testid]="'component-subtab-' + tab.id"
      (click)="switchTab(tab.id)"
    >
      {{ tab.label }}
    </button>
  </div>

  <section class="component-shell-body">
    <app-business-model-workbench *ngIf="activeTab() === 'businessComponents'"></app-business-model-workbench>

    <div *ngIf="activeTab() === 'contracts'" class="ctx-card domain-panel demo-panel" data-testid="component-contracts-placeholder">
      <div class="demo-panel-head">
        <div>
          <h3>交互契约</h3>
          <p class="field-hint">表达一次页面动作形成的数据交换约定，后续再关联任务编排。</p>
        </div>
        <span class="demo-count">规划中</span>
      </div>
      <div class="empty">第一版只保留入口，不改变后端数据模型。</div>
    </div>

    <div *ngIf="activeTab() === 'orchestration'" class="ctx-card domain-panel demo-panel" data-testid="component-orchestration-placeholder">
      <div class="demo-panel-head">
        <div>
          <h3>任务编排</h3>
          <p class="field-hint">一个交互契约可编排一组可复用任务，并定义任务之间的输入、输出映射。</p>
        </div>
        <span class="demo-count">规划中</span>
      </div>
      <div class="empty">第一版先手写粘合代码，界面预留参数映射和输出变量的位置。</div>
    </div>

    <div *ngIf="activeTab() === 'tasks'" class="ctx-card domain-panel demo-panel" data-testid="component-task-definition-placeholder">
      <div class="demo-panel-head">
        <div>
          <h3>任务定义</h3>
          <p class="field-hint">任务定义表达构件可提供的业务动作，接口编排只引用任务，不在这里写页面逻辑。</p>
        </div>
        <span class="demo-count">{{ tasks().length }} 个任务</span>
      </div>
      <table *ngIf="taskRows().length; else emptyTasks" class="term-table demo-table">
        <thead>
          <tr><th>任务</th><th>类型</th><th>地址/目标</th><th>归属构件</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of taskRows()">
            <td *ngFor="let cell of row">{{ cell }}</td>
          </tr>
        </tbody>
      </table>
      <ng-template #emptyTasks>
        <div class="empty">暂无任务定义。</div>
      </ng-template>
    </div>

    <app-entity-design-workbench *ngIf="activeTab() === 'entities'"></app-entity-design-workbench>
  </section>
</div>
